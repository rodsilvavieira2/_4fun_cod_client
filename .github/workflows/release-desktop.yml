name: Desktop Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: "4FunCode"
  APP_SLUG: "4fun-cod"
  APP_EXE_NAME: "_4fun_cod_client.exe"

  # Keep the Flutter version pinned for reproducible releases.
  # Must match the SDK used in development (see docs/RELEASES.md).
  FLUTTER_VERSION: "3.44.4"

jobs:
  # ------------------------------------------------------------
  # Linux
  # ------------------------------------------------------------

  build-linux:
    name: Build Linux x64
    # ubuntu-24.04: o onnxruntime estatico do ort vem pre-compilado com
    # toolchain nova (referencia __isoc23_* da glibc>=2.38 e _M_replace_cold
    # da libstdc++>=12) — no 22.04 (glibc 2.35) o link final quebra com
    # undefined reference (v1.1.2/v1.1.3). Custo: piso de glibc do bundle
    # sobe para 2.39.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libsecret-1-dev \
            libstdc++-12-dev \
            libudev-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libunwind-dev \
            libayatana-appindicator3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Resolve release version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "Release version: $VERSION"

      - name: Stamp pubspec version (exe == feed)
        shell: bash
        run: |
          set -euo pipefail
          # O updater compara a versão do binário com a do feed: sem carimbo,
          # o exe reportaria o fallback do pubspec e nunca veria update.
          sed -i -E "s/^version: .*/version: $APP_VERSION+${{ github.run_number }}/" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: Build Linux
        env:
          API_URL: ${{ vars.API_URL }}
          LIVEKIT_URL: ${{ vars.LIVEKIT_URL }}
          OTEL_ENABLED: ${{ vars.OTEL_ENABLED }}
          OTEL_VIA_API: ${{ vars.OTEL_VIA_API }}
          OTEL_ENDPOINT: ${{ vars.OTEL_ENDPOINT }}
          OTEL_ORG: ${{ vars.OTEL_ORG }}
        run: |
          DEFINES=()
          [ -n "$API_URL" ] && DEFINES+=(--dart-define=API_URL="$API_URL")
          [ -n "$LIVEKIT_URL" ] && DEFINES+=(--dart-define=LIVEKIT_URL="$LIVEKIT_URL")
          [ -n "$OTEL_ENABLED" ] && DEFINES+=(--dart-define=OTEL_ENABLED="$OTEL_ENABLED")
          [ -n "$OTEL_VIA_API" ] && DEFINES+=(--dart-define=OTEL_VIA_API="$OTEL_VIA_API")
          [ -n "$OTEL_ENDPOINT" ] && DEFINES+=(--dart-define=OTEL_ENDPOINT="$OTEL_ENDPOINT")
          [ -n "$OTEL_ORG" ] && DEFINES+=(--dart-define=OTEL_ORG="$OTEL_ORG")
          # P2 (review t_34728661): OTEL_BASIC_AUTH NUNCA baked via
          # --dart-define — release lê da env de runtime (ver AppConfig).

          # -v com log em arquivo: o ninja so mostra o comando que falhou, e
          # o driver clang engoliu o motivo do link v1.1.2. Em sucesso o log
          # eh descartado; em falha, o tail entrega alvo + erro reais.
          set -o pipefail
          flutter build linux -v \
            --release \
            --build-name "$APP_VERSION" \
            --build-number "$GITHUB_RUN_NUMBER" \
            "${DEFINES[@]}" >"$RUNNER_TEMP/build-linux-verbose.log" 2>&1 || {
            echo '--- build failed, verbose tail ---'
            tail -c 2000000 "$RUNNER_TEMP/build-linux-verbose.log"
            exit 1
          }

      # O link do plugin (onnxruntime estatico dentro do .a Rust) morreu uma
      # vez sem diagnostics (v1.1.2). Se falhar de novo, este step entrega
      # disco/RAM/OOM em vez de outra charada.
      - name: Diagnose native link failure
        if: failure()
        shell: bash
        run: |
          df -h "$GITHUB_WORKSPACE" /tmp || true
          free -g || true
          ls -la native/deepfilter_bridge/target/release/libfourfun_deepfilter_bridge.a || true
          dmesg 2>/dev/null | tail -5 || true

      - name: Bundle tray native deps (fecho transitivo)
        shell: bash
        run: |
          BUNDLE="build/linux/x64/release/bundle"
          # tray_manager linka contra a pilha ayatana/appindicator, que varia
          # por distro (whack-a-mole real: v0.1.7 esqueceu indicator3.so.7).
          # Fecha a arvore via NEEDEDs e copia tudo p/ bundle/lib
          # (RUNPATH $ORIGIN/lib do executavel ja resolve — vale p/ tar.gz e AppImage).
          PAT='lib(ayatana|appindicator|indicator|ido|dbusmenu)[^ ]*\.so\.[0-9]+'
          for pass in 1 2 3 4; do
            NEW=0
            for so in "$BUNDLE"/lib/*.so "$BUNDLE"/_4fun_cod_client; do
              [ -f "$so" ] || continue
              for need in $(readelf -d "$so" 2>/dev/null | grep -o -E "$PAT" | sort -u); do
                if [ ! -f "$BUNDLE/lib/$need" ]; then
                  path="$(ldconfig -p | grep -m1 -F "$need" | awk '{print $NF}')"
                  if [ -n "$path" ]; then
                    cp -L "$path" "$BUNDLE/lib/"
                    echo "bundled: $need"
                    NEW=1
                  fi
                fi
              done
            done
            [ "$NEW" = 0 ] && break
          done
          # Assert: todo NEEDED do fecho precisa existir dentro do bundle.
          MISSING=0
          for so in "$BUNDLE"/lib/*.so; do
            for need in $(readelf -d "$so" 2>/dev/null | grep -o -E "$PAT" | sort -u); do
              if [ ! -f "$BUNDLE/lib/$need" ]; then
                echo "FALTANDO no bundle: $need (pedido por $so)"
                MISSING=1
              fi
            done
          done
          [ "$MISSING" = 0 ] || exit 1
          echo "tray deps OK:"; ls "$BUNDLE/lib" | grep -E 'ayatana|appindicator|indicator|ido|dbusmenu'

      - name: Create Linux package
        shell: bash
        run: |
          mkdir -p "package/$APP_SLUG"
          mkdir -p dist/linux

          cp -a \
            build/linux/x64/release/bundle/. \
            "package/$APP_SLUG/"

          tar \
            -C package \
            -czf "dist/linux/${APP_SLUG}-linux-x64-${APP_VERSION}.tar.gz" \
            "$APP_SLUG"

      - name: Show Linux package
        run: |
          ls -lh dist/linux

      - name: Restore updater signing key
        env:
          UPDATER_BUNDLE_B64: ${{ secrets.DESKTOP_UPDATER_KEY_BUNDLE }}
          UPDATER_PASSPHRASE: ${{ secrets.DESKTOP_UPDATER_KEY_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$UPDATER_BUNDLE_B64" | base64 -d > "$RUNNER_TEMP/release-key.dukey"
          dart run desktop_updater:release keys import \
            --input "$RUNNER_TEMP/release-key.dukey" \
            --passphrase-env UPDATER_PASSPHRASE
          shred -u "$RUNNER_TEMP/release-key.dukey"

      - name: Package updater files (Linux)
        shell: bash
        run: |
          set -euo pipefail
          # Input = bundle COM as .so do tray (step anterior); o zip do
          # updater preserva modos Unix do runner.
          dart run desktop_updater:package \
            --input "build/linux/x64/release/bundle" \
            --output "dist/updater/linux" \
            --package-id "io.github.rodsilvavieira2.fourfun" \
            --app-name "$APP_NAME" \
            --version "$APP_VERSION" \
            --build-number "${{ github.run_number }}" \
            --platform linux \
            --channel stable \
            --artifact-url "https://github.com/rodsilvavieira2/_4fun_cod_client/releases/download/${{ github.ref_name }}/$APP_NAME-$APP_VERSION-linux.zip"
          dart run desktop_updater:release sign \
            --release "dist/updater/linux/release.json"

      - name: Build AppImage
        shell: bash
        run: |
          BUNDLE="build/linux/x64/release/bundle"

          rm -rf AppDir
          mkdir -p "AppDir/usr/bin" dist/linux

          cp -a "$BUNDLE/." "AppDir/usr/bin/"
          cp "packaging/linux/4fun-cod.desktop" "AppDir/4fun-cod.desktop"
          cp "packaging/linux/4fun-cod.png" "AppDir/4fun-cod.png"

          # Deps nativas do tray ja estao em bundle/lib (step "Bundle tray
          # native deps"); o AppRun exporta usr/bin/lib via LD_LIBRARY_PATH.
          ls AppDir/usr/bin/lib | grep -E 'ayatana|appindicator|indicator|ido|dbusmenu' || true

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/lib:$HERE/usr/bin/lib:$LD_LIBRARY_PATH"
          exec "$HERE/usr/bin/_4fun_cod_client" "$@"
          EOF
          chmod +x AppDir/AppRun

          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool

          ./appimagetool --appimage-extract-and-run \
            AppDir \
            "dist/linux/${APP_SLUG}-linux-x64-${APP_VERSION}.AppImage"

          ls -lh dist/linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/linux
          if-no-files-found: error
          retention-days: 7

      - name: Upload Linux updater files
        uses: actions/upload-artifact@v4
        with:
          name: updater-linux
          path: dist/updater/linux
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------
  # Windows
  # ------------------------------------------------------------

  build-windows:
    name: Build Windows x64
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          # Sem cache: releases por tag são esporádicas e o cache expira
          # entre runs — no Windows o save do SDK (~7min) + pub (~2,5min)
          # no Post Setup custava mais do que o download fresco no Setup.
          cache: false
          pub-cache: false

      - name: Flutter version
        run: flutter --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Resolve release version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")

          echo "APP_VERSION=$version" >> $env:GITHUB_ENV

          Write-Host "Release version: $version"

      - name: Stamp pubspec version (exe == feed)
        shell: pwsh
        run: |
          # O updater compara a versão do binário com a do feed: sem carimbo,
          # o exe reportaria o fallback do pubspec e nunca veria update.
          (Get-Content pubspec.yaml) -replace '^version: .*', "version: $env:APP_VERSION+${{ github.run_number }}" | Set-Content pubspec.yaml
          Select-String '^version:' pubspec.yaml

      - name: Setup Rust (DeepFilterNet bridge via cargo no CMake)
        uses: dtolnay/rust-toolchain@stable

      - name: Build DeepFilterNet bridge (cargo + onnxruntime stage)
        shell: pwsh
        run: |
          # Roda fora do MSBuild de proposito: o flutter invoca o msbuild com
          # verbosity baixa e o stdout do custom command (cargo) e suprimido —
          # falha virava MSB8066 sem log. Aqui o output do cargo aparece integral.
          # O custom command no CMakeLists continua como fallback (gera os mesmos
          # outputs no mesmo lugar; se este step ja gerou, fica up-to-date).
          cargo build --release --manifest-path native/deepfilter_bridge/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # DIAG temporario (issue pipe Windows): o que o build script do
          # ort-sys baixou/registrou? Remover quando o stage estabilizar.
          Get-ChildItem native\deepfilter_bridge\target\release\build -Filter 'ort-sys-*' | ForEach-Object {
            Write-Host "== $($_.FullName)"
            Get-ChildItem $_.FullName | Format-Table Name, Length | Out-String | Write-Host
            foreach ($f in @('output','stderr')) {
              $p = Join-Path $_.FullName $f
              if (Test-Path $p) { Write-Host "--- $f :"; Get-Content $p | Select-Object -First 15 | Write-Host }
            }
          }
          Write-Host '== dfbin:'
          Get-ChildItem "$env:LOCALAPPDATA\ort.pyke.io\dfbin" -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 15 FullName | Write-Host

          $roots = @()
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path $vswhere) {
            $roots += & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          }
          $dumpbin = $null
          foreach ($r in ($roots | Where-Object { $_ } | Sort-Object -Unique)) {
            $cand = Get-ChildItem "$r\VC\Tools\MSVC" -Filter dumpbin.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
            if ($cand) { $dumpbin = $cand; break }
          }
          if (-not $dumpbin) { Write-Error 'dumpbin nao encontrado no runner'; exit 1 }
          $libexe = Join-Path (Split-Path $dumpbin) 'lib.exe'
          if (-not (Test-Path $libexe)) { Write-Error "lib.exe nao encontrado ao lado de $dumpbin"; exit 1 }

          $bridge = Join-Path (Get-Location) 'native\deepfilter_bridge'
          $stage = Join-Path $bridge 'target\stage-windows'
          & cmake -DBRIDGE_DIR="$bridge" -DSTAGE_DIR="$stage" `
            -DDUMPBIN_EXE="$dumpbin" -DLIB_EXE="$libexe" `
            -P packages/flutter_webrtc/windows/stage_ort_windows.cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem $stage

      - name: Build Windows
        shell: pwsh
        env:
          API_URL: ${{ vars.API_URL }}
          LIVEKIT_URL: ${{ vars.LIVEKIT_URL }}
          OTEL_ENABLED: ${{ vars.OTEL_ENABLED }}
          OTEL_VIA_API: ${{ vars.OTEL_VIA_API }}
          OTEL_ENDPOINT: ${{ vars.OTEL_ENDPOINT }}
          OTEL_ORG: ${{ vars.OTEL_ORG }}
        run: |
          $defines = @()
          if ($env:API_URL) { $defines += "--dart-define=API_URL=$env:API_URL" }
          if ($env:LIVEKIT_URL) { $defines += "--dart-define=LIVEKIT_URL=$env:LIVEKIT_URL" }
          if ($env:OTEL_ENABLED) { $defines += "--dart-define=OTEL_ENABLED=$env:OTEL_ENABLED" }
          if ($env:OTEL_VIA_API) { $defines += "--dart-define=OTEL_VIA_API=$env:OTEL_VIA_API" }
          if ($env:OTEL_ENDPOINT) { $defines += "--dart-define=OTEL_ENDPOINT=$env:OTEL_ENDPOINT" }
          if ($env:OTEL_ORG) { $defines += "--dart-define=OTEL_ORG=$env:OTEL_ORG" }
          # P2 (review t_34728661): OTEL_BASIC_AUTH NUNCA baked via
          # --dart-define — release lê da env de runtime (ver AppConfig).

          flutter build windows `
            --release `
            --build-name "$env:APP_VERSION" `
            --build-number "${{ github.run_number }}" `
            @defines

      - name: Assert Windows native deps (dumpbin)
        shell: pwsh
        run: |
          # Primo do assert linux: toda DLL importada pelo bundle precisa estar
          # (a) dentro do bundle, (b) no VC++ redist (instalado pelo setup.exe),
          # ou (c) no System32. Limite conhecido: o runner tem VS instalado, entao
          # uma dep de terceiro presente no runner mas ausente no usuario passaria —
          # plugin novo com DLL propria exige revisao manual.
          $roots = @()
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path $vswhere) {
            $roots += & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          }
          $roots += @(
            'C:\Program Files\Microsoft Visual Studio\2022\Enterprise',
            'C:\Program Files\Microsoft Visual Studio\2022\Professional',
            'C:\Program Files\Microsoft Visual Studio\2022\Community',
            'C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools'
          )
          $dumpbin = $null
          foreach ($r in ($roots | Where-Object { $_ } | Sort-Object -Unique)) {
            $cand = Get-ChildItem "$r\VC\Tools\MSVC" -Filter dumpbin.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
            if ($cand) { $dumpbin = $cand; break }
          }
          if (-not $dumpbin) { Write-Error 'dumpbin não encontrado no runner'; exit 1 }
          Write-Host "dumpbin: $dumpbin"

          $bindir = 'build\windows\x64\runner\Release'
          $bundle = Get-ChildItem $bindir -Include *.exe, *.dll -Recurse | ForEach-Object { $_.Name.ToLower() }
          $redist = @('concrt140.dll','msvcp140.dll','msvcp140_1.dll','msvcp140_2.dll','msvcp140_atomic_wait.dll','msvcp140_codecvt_ids.dll','vccorlib140.dll','vcruntime140.dll','vcruntime140_1.dll')
          # Delay-load conhecido: dartjni carrega jvm.dll so se o recurso JVM
          # for usado; o app abre e roda sem ela (cinturao + suspensorio junto
          # do filtro de secao acima).
          $delayOk = @('jvm.dll')
          $system32 = Join-Path $env:SystemRoot 'System32'

          $imports = @()
          $unknown = @()
          Get-ChildItem $bindir -Include *.exe, *.dll -Recurse | ForEach-Object {
            $bin = $_
            $deps = @()
            # dumpbin lista 2 secoes: "dependencies" (load-time, obrigatorias)
            # e "delay load dependencies" (ex.: jvm.dll via dartjni — so carrega
            # se o recurso for usado; app abre sem ela). So a 1a reprova o build.
            $inDeps = $false
            foreach ($line in (& $dumpbin /DEPENDENTS $bin.FullName 2>$null)) {
              if ($line -match 'delay.{0,5}load.{0,5}dependenc') { $inDeps = $false }
              elseif ($line -match 'following dependencies:') { $inDeps = $true }
              elseif ($inDeps -and ($line -match '^\s+([A-Za-z0-9_\-\+\.]+\.dll)\s*$')) { $deps += $Matches[1].ToLower() }
            }
            foreach ($d in ($deps | Sort-Object -Unique)) {
              if ($imports -notcontains $d) { $imports += $d }
              # api-ms-win-* = API Sets do Universal CRT: contratos virtuais do
              # loader, presentes em todo Win10+ e no VC++ redist — nao sao
              # arquivos em System32, entao o Test-Path falharia a toa.
              if (($bundle -notcontains $d) -and ($redist -notcontains $d) -and ($delayOk -notcontains $d) -and ($d -notmatch '^api-ms-win-') -and (-not (Test-Path (Join-Path $system32 $d)))) {
                $entry = "$d (via $($bin.Name))"
                if ($unknown -notcontains $entry) { $unknown += $entry }
              }
            }
          }
          Write-Host ('Imports: ' + ($imports -join ', '))
          Write-Host ('Via VC++ redist: ' + (($imports | Where-Object { $redist -contains $_ }) -join ', '))
          if ($unknown.Count -gt 0) { Write-Error ('Dependências fora do bundle/sistema/redist: ' + ($unknown -join '; ')); exit 1 }

      - name: Download VC++ Redistributable
        shell: pwsh
        run: |
          # Payload do setup.exe (installer/windows.iss instala via [Run] se
          # ausente) e do ZIP portable.
          New-Item -ItemType Directory -Force -Path "installer\vendor" | Out-Null
          Invoke-WebRequest `
            -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" `
            -OutFile "installer\vendor\vc_redist.x64.exe"
          Get-ChildItem installer\vendor

      # --------------------------------------------------------
      # Portable ZIP
      # --------------------------------------------------------

      - name: Create portable Windows package
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "package\$env:APP_SLUG" | Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "dist\windows" | Out-Null

          Copy-Item `
            -Path "build\windows\x64\runner\Release\*" `
            -Destination "package\$env:APP_SLUG" `
            -Recurse `
            -Force

          # Runtime MSVC nao vai no bundle flutter — se o app nao abrir em
          # Windows limpo (VCRUNTIME140.dll), rode este instalador.
          Copy-Item `
            -Path "installer\vendor\vc_redist.x64.exe" `
            -Destination "package\$env:APP_SLUG" `
            -Force

          Compress-Archive `
            -Path "package\$env:APP_SLUG" `
            -DestinationPath "dist\windows\$env:APP_SLUG-windows-x64-$env:APP_VERSION-portable.zip"

      # --------------------------------------------------------
      # Installer
      # --------------------------------------------------------

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Create Windows installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

          & $iscc `
            "/DAppName=$env:APP_NAME" `
            "/DAppSlug=$env:APP_SLUG" `
            "/DAppExeName=$env:APP_EXE_NAME" `
            "/DAppVersion=$env:APP_VERSION" `
            "installer\windows.iss"

      - name: Show Windows packages
        shell: pwsh
        run: |
          Get-ChildItem dist\windows

      - name: Restore updater signing key
        env:
          UPDATER_BUNDLE_B64: ${{ secrets.DESKTOP_UPDATER_KEY_BUNDLE }}
          UPDATER_PASSPHRASE: ${{ secrets.DESKTOP_UPDATER_KEY_PASSPHRASE }}
        shell: pwsh
        run: |
          # DPAPI no runner Windows é flake (timeout esporádico) — import é
          # idempotente, então retry com backoff.
          $attempt = 0
          while ($true) {
            $attempt++
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\release-key.dukey", [Convert]::FromBase64String($env:UPDATER_BUNDLE_B64))
            dart run desktop_updater:release keys import --input "$env:RUNNER_TEMP\release-key.dukey" --passphrase-env UPDATER_PASSPHRASE
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -ge 5) { throw "keys import failed after $attempt attempts" }
            Remove-Item "$env:RUNNER_TEMP\release-key.dukey" -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds (15 * $attempt)
          }
          Remove-Item "$env:RUNNER_TEMP\release-key.dukey" -Force -ErrorAction SilentlyContinue

      - name: Package updater files (Windows)
        shell: pwsh
        run: |
          # Input = Release cru (SEM vc_redist — o updater não deve
          # versionar o instalador MSVC dentro do app). Zip direto:
          # wholeDirectoryReplace preservando unins*.exe do Inno.
          dart run desktop_updater:package `
            --input "build\windows\x64\runner\Release" `
            --output "dist\updater\windows" `
            --package-id "fourfun_cod_client" `
            --app-name "$env:APP_NAME" `
            --version "$env:APP_VERSION" `
            --build-number "${{ github.run_number }}" `
            --platform windows `
            --channel stable `
            --artifact-url "https://github.com/rodsilvavieira2/_4fun_cod_client/releases/download/${{ github.ref_name }}/$env:APP_NAME-$env:APP_VERSION-windows.zip"
          dart run desktop_updater:release sign --release "dist\updater\windows\release.json"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/windows
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows updater files
        uses: actions/upload-artifact@v4
        with:
          name: updater-windows
          path: dist/updater/windows
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------
  # GitHub Release
  # ------------------------------------------------------------

  release:
    name: Publish GitHub Release

    needs:
      - build-linux
      - build-windows

    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      - name: Checkout (tags para --verify-tag)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Download updater files
        uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          path: dist/updater

      - name: Setup Flutter (updater tooling)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: List release files
        run: |
          find dist -maxdepth 3 -type f -print

      - name: Restore updater signing key
        env:
          UPDATER_BUNDLE_B64: ${{ secrets.DESKTOP_UPDATER_KEY_BUNDLE }}
          UPDATER_PASSPHRASE: ${{ secrets.DESKTOP_UPDATER_KEY_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$UPDATER_BUNDLE_B64" | base64 -d > "$RUNNER_TEMP/release-key.dukey"
          dart run desktop_updater:release keys import \
            --input "$RUNNER_TEMP/release-key.dukey" \
            --passphrase-env UPDATER_PASSPHRASE
          shred -u "$RUNNER_TEMP/release-key.dukey"

      - name: Assemble update feed
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/rodsilvavieira2/_4fun_cod_client/releases/download/$GITHUB_REF_NAME"
          mkdir -p dist/updater/feed
          # Nomes únicos por plataforma (os release.json crus colidiriam).
          cp dist/updater/updater-linux/release.json dist/updater/feed/release-linux.json
          cp dist/updater/updater-windows/release.json dist/updater/feed/release-windows.json
          cp dist/updater/updater-linux/*.zip dist/updater/feed/
          cp dist/updater/updater-windows/*.zip dist/updater/feed/
          # Histórico: estende o feed publicado ou começa um novo (1ª vez).
          if curl -sfL "https://github.com/rodsilvavieira2/_4fun_cod_client/releases/latest/download/app-archive.json" \
              -o dist/updater/feed/app-archive.json; then
            echo "extending published feed"
            # upsert só aceita archive NÃO assinado; o sign final re-assina.
            python3 -c "import json; p='dist/updater/feed/app-archive.json'; d=json.load(open(p)); d.pop('signature', None); json.dump(d, open(p, 'w'), indent=2)"
          else
            echo "first feed release"
            rm -f dist/updater/feed/app-archive.json
          fi
          for platform in linux windows; do
            dart run desktop_updater:app_archive upsert \
              --archive dist/updater/feed/app-archive.json \
              --app-name "$APP_NAME" \
              --version "$VERSION" \
              --build-number "${{ github.run_number }}" \
              --platform "$platform" \
              --channel stable \
              --release-url "$BASE/release-$platform.json"
          done
          dart run desktop_updater:release sign \
            --app-archive dist/updater/feed/app-archive.json

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd dist

          # Só arquivos do nível raiz (dist/updater/ é insumo do feed,
          # com hashes próprios dentro dos release.json).
          find . -maxdepth 1 -type f -exec sha256sum {} + > SHA256SUMS.txt

          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # Regra do feed: zips + descriptors primeiro, app-archive.json
          # por último (upload separado abaixo).
          gh release create \
            "$GITHUB_REF_NAME" \
            *.tar.gz \
            *.AppImage \
            *.zip \
            *.exe \
            SHA256SUMS.txt \
            updater/feed/*.zip \
            updater/feed/release-*.json \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
          gh release upload \
            "$GITHUB_REF_NAME" \
            updater/feed/app-archive.json
          # Verificação hospedada via API (funciona com repo privado ou
          # público). Retry cobre propagação eventual dos assets.
          # O verify procura desktop_updater.keys.json no CWD (=dist).
          cp "$GITHUB_WORKSPACE/desktop_updater.keys.json" ./desktop_updater.keys.json
          fetch_retry() { # $1=pattern $2=dest-dir
            for i in $(seq 1 12); do
              if gh release download "$GITHUB_REF_NAME" -p "$1" -D "$2" --clobber; then return 0; fi
              sleep 10
            done
            echo "verificação hospedada falhou: $1" >&2
            return 1
          }
          for platform in linux windows; do
            fetch_retry "release-$platform.json" "$RUNNER_TEMP/hosted"
            dart run desktop_updater:verify --release "$RUNNER_TEMP/hosted/release-$platform.json"
          done
          fetch_retry "app-archive.json" "$RUNNER_TEMP/hosted"
          echo "hosted feed OK"
