name: Desktop Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: "4Fun Cod"
  APP_SLUG: "4fun-cod"
  APP_EXE_NAME: "_4fun_cod_client.exe"

  # Keep the Flutter version pinned for reproducible releases.
  # Must match the SDK used in development (see docs/RELEASES.md).
  FLUTTER_VERSION: "3.44.4"

jobs:
  # ------------------------------------------------------------
  # Linux
  # ------------------------------------------------------------

  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libstdc++-12-dev \
            libudev-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libunwind-dev \
            libayatana-appindicator3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Resolve release version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "Release version: $VERSION"

      - name: Build Linux
        env:
          API_URL: ${{ vars.API_URL }}
          LIVEKIT_URL: ${{ vars.LIVEKIT_URL }}
          OTEL_ENABLED: ${{ vars.OTEL_ENABLED }}
          OTEL_ENDPOINT: ${{ vars.OTEL_ENDPOINT }}
          OTEL_ORG: ${{ vars.OTEL_ORG }}
        run: |
          DEFINES=()
          [ -n "$API_URL" ] && DEFINES+=(--dart-define=API_URL="$API_URL")
          [ -n "$LIVEKIT_URL" ] && DEFINES+=(--dart-define=LIVEKIT_URL="$LIVEKIT_URL")
          [ -n "$OTEL_ENABLED" ] && DEFINES+=(--dart-define=OTEL_ENABLED="$OTEL_ENABLED")
          [ -n "$OTEL_ENDPOINT" ] && DEFINES+=(--dart-define=OTEL_ENDPOINT="$OTEL_ENDPOINT")
          [ -n "$OTEL_ORG" ] && DEFINES+=(--dart-define=OTEL_ORG="$OTEL_ORG")
          # P2 (review t_34728661): OTEL_BASIC_AUTH NUNCA baked via
          # --dart-define — release lê da env de runtime (ver AppConfig).

          flutter build linux \
            --release \
            --build-name "$APP_VERSION" \
            --build-number "$GITHUB_RUN_NUMBER" \
            "${DEFINES[@]}"

      - name: Create Linux package
        shell: bash
        run: |
          mkdir -p "package/$APP_SLUG"
          mkdir -p dist/linux

          cp -a \
            build/linux/x64/release/bundle/. \
            "package/$APP_SLUG/"

          tar \
            -C package \
            -czf "dist/linux/${APP_SLUG}-linux-x64-${APP_VERSION}.tar.gz" \
            "$APP_SLUG"

      - name: Show Linux package
        run: |
          ls -lh dist/linux

      - name: Build AppImage
        shell: bash
        run: |
          BUNDLE="build/linux/x64/release/bundle"

          rm -rf AppDir
          mkdir -p "AppDir/usr/bin" dist/linux

          cp -a "$BUNDLE/." "AppDir/usr/bin/"
          cp "packaging/linux/4fun-cod.desktop" "AppDir/4fun-cod.desktop"
          cp "packaging/linux/4fun-cod.png" "AppDir/4fun-cod.png"

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/_4fun_cod_client" "$@"
          EOF
          chmod +x AppDir/AppRun

          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool

          ./appimagetool --appimage-extract-and-run \
            AppDir \
            "dist/linux/${APP_SLUG}-linux-x64-${APP_VERSION}.AppImage"

          ls -lh dist/linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/linux
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------
  # Windows
  # ------------------------------------------------------------

  build-windows:
    name: Build Windows x64
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Resolve release version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")

          echo "APP_VERSION=$version" >> $env:GITHUB_ENV

          Write-Host "Release version: $version"

      - name: Build Windows
        shell: pwsh
        env:
          API_URL: ${{ vars.API_URL }}
          LIVEKIT_URL: ${{ vars.LIVEKIT_URL }}
          OTEL_ENABLED: ${{ vars.OTEL_ENABLED }}
          OTEL_ENDPOINT: ${{ vars.OTEL_ENDPOINT }}
          OTEL_ORG: ${{ vars.OTEL_ORG }}
        run: |
          $defines = @()
          if ($env:API_URL) { $defines += "--dart-define=API_URL=$env:API_URL" }
          if ($env:LIVEKIT_URL) { $defines += "--dart-define=LIVEKIT_URL=$env:LIVEKIT_URL" }
          if ($env:OTEL_ENABLED) { $defines += "--dart-define=OTEL_ENABLED=$env:OTEL_ENABLED" }
          if ($env:OTEL_ENDPOINT) { $defines += "--dart-define=OTEL_ENDPOINT=$env:OTEL_ENDPOINT" }
          if ($env:OTEL_ORG) { $defines += "--dart-define=OTEL_ORG=$env:OTEL_ORG" }
          # P2 (review t_34728661): OTEL_BASIC_AUTH NUNCA baked via
          # --dart-define — release lê da env de runtime (ver AppConfig).

          flutter build windows `
            --release `
            --build-name "$env:APP_VERSION" `
            --build-number "${{ github.run_number }}" `
            @defines

      # --------------------------------------------------------
      # Portable ZIP
      # --------------------------------------------------------

      - name: Create portable Windows package
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "package\$env:APP_SLUG" | Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "dist\windows" | Out-Null

          Copy-Item `
            -Path "build\windows\x64\runner\Release\*" `
            -Destination "package\$env:APP_SLUG" `
            -Recurse `
            -Force

          Compress-Archive `
            -Path "package\$env:APP_SLUG" `
            -DestinationPath "dist\windows\$env:APP_SLUG-windows-x64-$env:APP_VERSION-portable.zip"

      # --------------------------------------------------------
      # Installer
      # --------------------------------------------------------

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Create Windows installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

          & $iscc `
            "/DAppName=$env:APP_NAME" `
            "/DAppSlug=$env:APP_SLUG" `
            "/DAppExeName=$env:APP_EXE_NAME" `
            "/DAppVersion=$env:APP_VERSION" `
            "installer\windows.iss"

      - name: Show Windows packages
        shell: pwsh
        run: |
          Get-ChildItem dist\windows

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/windows
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------
  # GitHub Release
  # ------------------------------------------------------------

  release:
    name: Publish GitHub Release

    needs:
      - build-linux
      - build-windows

    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: List release files
        run: |
          find dist -maxdepth 2 -type f -print

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd dist

          sha256sum * > SHA256SUMS.txt

          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create \
            "$GITHUB_REF_NAME" \
            dist/* \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
