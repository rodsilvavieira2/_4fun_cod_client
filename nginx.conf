server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: o GoRouter usa hash routing (#/...), mas o fallback genérico
    # garante qualquer deep link sem 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com hash no nome (flutter release) — cache imutável
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # main.dart.js não tem hash no nome — nunca cachear (iteração dev)
    location = /main.dart.js {
        add_header Cache-Control "no-cache";
    }
}
