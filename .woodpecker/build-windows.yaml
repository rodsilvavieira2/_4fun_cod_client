# Client Flutter — Windows (agent local na VM). Backend local: `image` e o shell.
# Trocar para `pwsh` se PowerShell 7 estiver instalado na VM.
labels:
  runner: windows-build
  platform: windows/amd64

when:
  - event: [tag, manual]

steps:
  - name: environment
    image: powershell
    commands:
      - flutter doctor -v

  - name: dependencies
    image: powershell
    commands:
      - flutter pub get

  - name: build
    image: powershell
    commands:
      - $env:RUSTUP_TOOLCHAIN = 'stable'; $env:PATH = "$env:USERPROFILE\.rustup\toolchains\stable-x86_64-pc-windows-msvc\bin;$env:USERPROFILE\.cargo\bin;$env:PATH"; flutter build windows --release
