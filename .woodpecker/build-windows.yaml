# Client Flutter — Windows (agent local na VM). Backend local: `image` e o shell.
# Trocar para `pwsh` se PowerShell 7 estiver instalado na VM.
labels:
  runner: windows-build
  platform: windows/amd64

when:
  - event: [tag, manual]

steps:
  - name: environment
    image: powershell
    commands:
      - flutter doctor -v

  - name: dependencies
    image: powershell
    commands:
      - flutter pub get

  - name: bridge
    image: powershell
    commands:
      - $env:ORT_CACHE_DIR = Join-Path $env:USERPROFILE '.cache\ort-cache'; Remove-Item -Recurse -Force -Path $env:ORT_CACHE_DIR -ErrorAction SilentlyContinue; New-Item -ItemType Directory -Force -Path $env:ORT_CACHE_DIR | Out-Null; $env:RUSTUP_TOOLCHAIN = 'stable'; $env:PATH = "$env:USERPROFILE\.rustup\toolchains\stable-x86_64-pc-windows-msvc\bin;$env:USERPROFILE\.cargo\bin;$env:PATH"; cargo build --release --manifest-path native/deepfilter_bridge/Cargo.toml; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; Get-ChildItem (Join-Path $env:ORT_CACHE_DIR 'dfbin') -Recurse -Filter *.dll | Format-Table FullName, Length | Out-String | Write-Host; $dfbinDll = Get-ChildItem (Join-Path $env:ORT_CACHE_DIR 'dfbin') -Recurse -Filter DirectML.dll | Where-Object { $_.Length -gt 0 } | Select-Object -First 1 -ExpandProperty FullName; if (-not $dfbinDll) { Write-Error 'DirectML.dll nao baixado'; exit 1 }; $bridge = Join-Path (Get-Location) 'native\deepfilter_bridge'; $stage = Join-Path $bridge 'target\stage-windows'; $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'; $roots = @(); if (Test-Path $vswhere) { $roots += & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath }; $dumpbin = $null; foreach ($r in ($roots | Where-Object { $_ } | Sort-Object -Unique)) { $cand = Get-ChildItem "$r\VC\Tools\MSVC" -Filter dumpbin.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName; if ($cand) { $dumpbin = $cand; break } }; if (-not $dumpbin) { Write-Error 'dumpbin nao encontrado'; exit 1 }; $libexe = Join-Path (Split-Path $dumpbin) 'lib.exe'; $cmake = $null; try { $cmake = (Get-Command cmake -ErrorAction Stop).Source } catch { $cmake = 'C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe' }; $cargs = @("-DBRIDGE_DIR=$bridge", "-DSTAGE_DIR=$stage", "-DSTAGE_DLL=$stage\DirectML.dll", "-DSTAGE_LIB=$stage\DirectML.lib", "-DDUMPBIN_EXE=$dumpbin", "-DLIB_EXE=$libexe", "-DFOURFUN_DFBIN_DLL=$dfbinDll", "-P", "packages/flutter_webrtc/windows/stage_ort_windows.cmake"); & $cmake @cargs; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  - name: build
    image: powershell
    commands:
      - $env:ORT_CACHE_DIR = Join-Path $env:USERPROFILE '.cache\ort-cache'; New-Item -ItemType Directory -Force -Path $env:ORT_CACHE_DIR | Out-Null; $env:RUSTUP_TOOLCHAIN = 'stable'; $env:PATH = "$env:USERPROFILE\.rustup\toolchains\stable-x86_64-pc-windows-msvc\bin;$env:USERPROFILE\.cargo\bin;$env:PATH"; flutter build windows --release
