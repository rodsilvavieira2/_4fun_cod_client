# Client Flutter — Windows (agent local na VM). Backend local: `image` e o shell.
# Trocar para `pwsh` se PowerShell 7 estiver instalado na VM.
labels:
  runner: windows-build
  platform: windows/amd64

when:
  - event: [tag, manual]

steps:
  - name: environment
    image: powershell
    commands:
      - flutter doctor -v

  - name: dependencies
    image: powershell
    commands:
      - flutter pub get

  - name: bridge
    image: powershell
    commands:
      - $env:RUSTUP_TOOLCHAIN = 'stable'; $env:PATH = "$env:USERPROFILE\.rustup\toolchains\stable-x86_64-pc-windows-msvc\bin;$env:USERPROFILE\.cargo\bin;$env:PATH"; cargo build --release --manifest-path native/deepfilter_bridge/Cargo.toml; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; $bridge = Join-Path (Get-Location) 'native\deepfilter_bridge'; $stage = Join-Path $bridge 'target\stage-windows'; $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'; $roots = @(); if (Test-Path $vswhere) { $roots += & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath }; $dumpbin = $null; foreach ($r in ($roots | Where-Object { $_ } | Sort-Object -Unique)) { $cand = Get-ChildItem "$r\VC\Tools\MSVC" -Filter dumpbin.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName; if ($cand) { $dumpbin = $cand; break } }; if (-not $dumpbin) { Write-Error 'dumpbin nao encontrado'; exit 1 }; $libexe = Join-Path (Split-Path $dumpbin) 'lib.exe'; $cmake = $null; try { $cmake = (Get-Command cmake -ErrorAction Stop).Source } catch { $cmake = 'C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe' }; & $cmake -DBRIDGE_DIR=$bridge -DSTAGE_DIR=$stage -DSTAGE_DLL=$stage\DirectML.dll -DSTAGE_LIB=$stage\DirectML.lib -DDUMPBIN_EXE=$dumpbin -DLIB_EXE=$libexe -P packages/flutter_webrtc/windows/stage_ort_windows.cmake; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  - name: build
    image: powershell
    commands:
      - $env:RUSTUP_TOOLCHAIN = 'stable'; $env:PATH = "$env:USERPROFILE\.rustup\toolchains\stable-x86_64-pc-windows-msvc\bin;$env:USERPROFILE\.cargo\bin;$env:PATH"; flutter build windows --release
