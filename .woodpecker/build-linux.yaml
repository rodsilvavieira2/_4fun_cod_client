# Client Flutter — Linux (runner linux-docker). Escopo: linux/windows (AGENTS.md).
# NOTA: cada step Docker e um container novo; sysdeps via apt precisam estar no
# MESMO step que usa elas (workspace persiste, sistema nao).
labels:
  runner: linux-docker

when:
  - event: [tag, manual]

steps:
  - name: ci
    image: mobiledevops/flutter-sdk-image:3.44.4
    commands:
      - apt-get update && apt-get install -y clang cmake git ninja-build pkg-config libgtk-3-dev libsecret-1-dev libstdc++-12-dev libudev-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libunwind-dev libayatana-appindicator3-dev
      - flutter --version
      - flutter pub get
      - flutter analyze lib test
      - flutter test
      - flutter build linux --release
