# Client Flutter — Linux (runner linux-docker). Escopo: linux/windows (AGENTS.md).
# NOTA: cada step Docker e um container novo; sysdeps via apt precisam estar no
# MESMO step que usa elas (workspace persiste, sistema nao).
labels:
  runner: linux-docker

when:
  - event: [tag, manual]

steps:
  - name: ci
    image: ghcr.io/cirruslabs/flutter:stable
    commands:
      - apt-get update && apt-get install -y clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - flutter --version
      - flutter pub get
      - flutter analyze
      - flutter test
      - flutter build linux --release
