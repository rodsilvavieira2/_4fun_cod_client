# Client Flutter — Linux (runner linux-docker). Escopo: linux/windows (AGENTS.md).
# NOTA: cada step Docker e um container novo; sysdeps via apt precisam estar no
# MESMO step que usa elas (workspace persiste, sistema nao).
labels:
  runner: linux-docker

when:
  - event: [tag, manual]

steps:
  - name: ci
    image: mobiledevops/flutter-sdk-image:3.44.4
    environment:
      API_URL:
        from_secret: api_url
      LIVEKIT_URL:
        from_secret: livekit_url
      OTEL_ENABLED:
        from_secret: otel_enabled
      OTEL_ENDPOINT:
        from_secret: otel_endpoint
      OTEL_ORG:
        from_secret: otel_org
      OTEL_VIA_API:
        from_secret: otel_via_api
    commands:
      - apt-get update && apt-get install -y clang cmake git ninja-build pkg-config libgtk-3-dev libsecret-1-dev libstdc++-12-dev libudev-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libunwind-dev libayatana-appindicator3-dev curl
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal && export PATH="$HOME/.cargo/bin:$PATH" && cargo --version && rustc --version
      - flutter --version
      - flutter pub get
      - flutter analyze lib test
      - flutter test
      # Build aqui so em tags nao-v*: em v* o step `release` faz o build UNICO
      # ja versionado (sem carimbo o updater nunca veria update).
      - 'case "${CI_COMMIT_TAG:-}" in v*) echo "skip: build versionado no step release";; *) flutter build linux --release --dart-define=API_URL=$API_URL --dart-define=LIVEKIT_URL=$LIVEKIT_URL --dart-define=OTEL_ENABLED=$OTEL_ENABLED --dart-define=OTEL_ENDPOINT=$OTEL_ENDPOINT --dart-define=OTEL_VIA_API=$OTEL_VIA_API;; esac'

  # Release (tags v*): build UNICO versionado + deposita no share p/ o publish.
  # Gate v* na 1a linha; nas ci-* o step entra como skipped (exit 78).
  - name: release
    image: mobiledevops/flutter-sdk-image:3.44.4
    volumes:
      - /home/rodrigo/Personal/4fun_cod/infra/windows:/share
    environment:
      API_URL:
        from_secret: api_url
      LIVEKIT_URL:
        from_secret: livekit_url
      OTEL_ENABLED:
        from_secret: otel_enabled
      OTEL_ENDPOINT:
        from_secret: otel_endpoint
      OTEL_ORG:
        from_secret: otel_org
      OTEL_VIA_API:
        from_secret: otel_via_api
    commands:
      - 'case "$CI_COMMIT_TAG" in v*) ;; *) echo "skip: nao e tag v*"; exit 78;; esac'
      - bash tooling-woodpecker/release-linux.sh
