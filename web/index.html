<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="4FunCode — cliente desktop para Linux e Windows.">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>4FunCode — Web não suportado</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #080715;
      color: #f6f3ff;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top left, rgba(123, 92, 255, .28), transparent 34rem),
        linear-gradient(135deg, #090817 0%, #121026 100%);
    }

    main {
      width: min(92vw, 34rem);
      padding: 2rem;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 1.5rem;
      background: rgba(25, 22, 44, .78);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .38);
    }

    h1 {
      margin: 0 0 .75rem;
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      line-height: 1.05;
    }

    p {
      margin: 0;
      color: rgba(246, 243, 255, .76);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <h1>Web não é suportado</h1>
    <p>
      O 4FunCode agora é mantido apenas para os clientes desktop Linux e
      Windows. Use um desses builds para acessar voz, vídeo e controles de
      áudio.
    </p>
  </main>
</body>
</html>
